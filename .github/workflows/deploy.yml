name: Deploy

# Runs only after CI passes on main (dev env) — prod deploys are manual (workflow_dispatch).
# Requires GitHub Secrets (never commit them):
#   FIREBASE_SERVICE_ACCOUNT_DEV / FIREBASE_SERVICE_ACCOUNT_PROD  (JSON)
#   FIREBASE_PROJECT_DEV / FIREBASE_PROJECT_PROD
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_PAGES_PROJECT
#   FIREBASE_WEB_API_KEY, GEMINI_API_KEY (optional; mentor falls back to rules-only), BACKUP_BUCKET (optional)
# Repository/environment variables (public):
#   VITE_API_BASE      e.g. https://europe-west1-<project>.cloudfunctions.net/api
#   ALLOWED_ORIGINS    e.g. https://learn.example.com,https://localhost   (https://localhost = Android app)
#   VITE_SENTRY_DSN    optional
#   APP_URL            public web URL, e.g. https://learn.example.com (email links + absolute Web Push links)
#   TRUST_PROXY_HOPS   optional (default 1 = Google front end; 2 if Cloudflare proxies the API)
#   VITE_FIREBASE_API_KEY / _PROJECT_ID / _MESSAGING_SENDER_ID / _APP_ID / _VAPID_KEY   optional (Web Push)
# Optional secrets: SMTP_URL (smtps://user:pass@host:465 — weekly manager email), MAIL_FROM
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, prod]
        default: dev

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}
    env:
      TARGET: ${{ github.event.inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check deploy secrets are configured
        id: secrets
        run: |
          if [ -z "${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}" ] || [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Deploy secrets missing — skipping deploy (see README › Deployment)."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.configured == 'true'
        with:
          node-version: 20
          cache: npm
      - if: steps.secrets.outputs.configured == 'true'
        run: npm ci
      - name: Build web
        if: steps.secrets.outputs.configured == 'true'
        run: npm run build
        env:
          VITE_APP_ENV: ${{ env.TARGET }}
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ vars.VITE_FIREBASE_VAPID_KEY }}
      - name: Deploy Cloud Functions + Rules
        if: steps.secrets.outputs.configured == 'true'
        env:
          SMTP_URL: ${{ secrets.SMTP_URL }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
        run: |
          echo '${{ env.TARGET == 'prod' && secrets.FIREBASE_SERVICE_ACCOUNT_PROD || secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}' > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          # Runtime config for the functions (read by functions/src/config.ts); never committed.
          {
            echo "APP_ENV=${{ env.TARGET }}"
            echo "DATA_BACKEND=firestore"
            echo "ALLOWED_ORIGINS=${{ vars.ALLOWED_ORIGINS }}"
            echo "FIREBASE_WEB_API_KEY=${{ secrets.FIREBASE_WEB_API_KEY }}"
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}"
            echo "BACKUP_BUCKET=${{ secrets.BACKUP_BUCKET }}"
            echo "APP_VERSION=${{ github.sha }}"
            echo "APP_URL=${{ vars.APP_URL }}"
            echo "TRUST_PROXY_HOPS=${{ vars.TRUST_PROXY_HOPS || '1' }}"
            # Passed via env (not template-expanded in the script) so passwords with $ or quotes survive.
            echo "SMTP_URL=$SMTP_URL"
            echo "MAIL_FROM=$MAIL_FROM"
          } > functions/.env
          npx -y firebase-tools@14 deploy --only functions,firestore,storage --project "${{ env.TARGET == 'prod' && secrets.FIREBASE_PROJECT_PROD || secrets.FIREBASE_PROJECT_DEV }}" --non-interactive
          rm -f "$RUNNER_TEMP/sa.json" functions/.env
      - name: Deploy PWA to Cloudflare Pages
        if: steps.secrets.outputs.configured == 'true'
        run: npx -y wrangler@4 pages deploy apps/web/dist --project-name "${{ secrets.CLOUDFLARE_PAGES_PROJECT }}" --branch "${{ env.TARGET == 'prod' && 'main' || 'dev' }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

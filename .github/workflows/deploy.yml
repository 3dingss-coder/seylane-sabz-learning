name: Deploy to Cloudflare (Worker + D1 Database)

# Automatically deploys the full-stack site (React PWA + /v1/* API + Cloudflare D1 SQLite Database)
# to Cloudflare on every push to `main` (or manual trigger).
#
# Required GitHub Secrets (Settings -> Secrets and variables -> Actions -> New repository secret):
#   CLOUDFLARE_API_TOKEN    (Cloudflare API Token with Workers Scripts:Edit, D1:Edit, Cloudflare Pages:Edit)
#   CLOUDFLARE_ACCOUNT_ID   (Your 32-character Cloudflare Account ID)
#
# Optional Secrets / Variables:
#   GEMINI_API_KEY                 (Optional: enables AI Mentor; falls back to rule-based mentor without it)
#   CLOUDFLARE_D1_DATABASE_NAME    (Optional: defaults to `seylane-sabz-db`; auto-created if missing)
#   CLOUDFLARE_PAGES_PROJECT       (Optional: if you also want `wrangler pages deploy` in addition to Worker)
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy to Cloudflare + D1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Cloudflare credentials
        id: cf
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "### ☁️ راهنمای اتصال خودکار GitHub به Cloudflare"
              echo "برای اینکه گیت‌هاب به‌صورت خودکار دیتابیس D1 و سایت را روی کلودفلر منتشر کند، دو مقدار زیر را در **Settings → Secrets and variables → Actions** ثبت کنید:"
              echo "- \`CLOUDFLARE_API_TOKEN\`"
              echo "- \`CLOUDFLARE_ACCOUNT_ID\`"
              echo ""
              echo "یا مستقیماً از داخل داشبورد کلودفلر (**Workers & Pages → Create → Import a repository**) مخزن گیت‌هاب را وصل کنید."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.cf.outputs.configured == 'true'
        with:
          node-version: 22
          cache: npm

      - if: steps.cf.outputs.configured == 'true'
        run: npm ci

      - name: Build Functions + Seed Snapshot + Web PWA
        if: steps.cf.outputs.configured == 'true'
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
        run: npm run build

      - name: Provision Cloudflare D1 Database & Deploy Full-Stack Worker
        if: steps.cf.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DB_NAME: ${{ vars.CLOUDFLARE_D1_DATABASE_NAME || 'seylane-sabz-db' }}
        run: |
          set -e
          echo "Checking Cloudflare D1 database: $DB_NAME ..."
          DB_JSON=$(npx --yes wrangler@4 d1 list --json 2>/dev/null || echo "[]")
          DB_ID=$(node -e '
            try {
              const list = JSON.parse(process.argv[1] || "[]");
              const found = Array.isArray(list) ? list.find(d => d.name === process.argv[2]) : null;
              if (found && found.uuid) process.stdout.write(found.uuid);
            } catch {}
          ' "$DB_JSON" "$DB_NAME")

          if [ -z "$DB_ID" ]; then
            echo "Creating Cloudflare D1 database: $DB_NAME ..."
            npx --yes wrangler@4 d1 create "$DB_NAME" || true
            DB_JSON=$(npx --yes wrangler@4 d1 list --json 2>/dev/null || echo "[]")
            DB_ID=$(node -e '
              try {
                const list = JSON.parse(process.argv[1] || "[]");
                const found = Array.isArray(list) ? list.find(d => d.name === process.argv[2]) : null;
                if (found && found.uuid) process.stdout.write(found.uuid);
              } catch {}
            ' "$DB_JSON" "$DB_NAME")
          fi

          if [ -n "$DB_ID" ]; then
            echo "Binding D1 database ($DB_NAME -> $DB_ID) in wrangler.toml ..."
            cat >> wrangler.toml <<EOF

          [[d1_databases]]
          binding = "DB"
          database_name = "$DB_NAME"
          database_id = "$DB_ID"
          EOF
            echo "Applying D1 schema migration (migrations/0001_init.sql) ..."
            npx --yes wrangler@4 d1 execute "$DB_NAME" --remote --file=migrations/0001_init.sql || true
          else
            echo "::warning::Could not resolve D1 database ID; deploying Worker with in-memory fallback."
          fi

          npx --yes wrangler@4 deploy

      - name: Optional Deploy to Cloudflare Pages (if CLOUDFLARE_PAGES_PROJECT is set)
        if: steps.cf.outputs.configured == 'true' && (secrets.CLOUDFLARE_PAGES_PROJECT != '' || vars.CLOUDFLARE_PAGES_PROJECT != '')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ secrets.CLOUDFLARE_PAGES_PROJECT || vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          npx --yes wrangler@4 pages deploy apps/web/dist --project-name "$PAGES_PROJECT" --branch main

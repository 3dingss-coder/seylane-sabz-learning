name: Deploy to Cloudflare (Worker + D1 Database)

# Automatically deploys the full-stack site (React PWA + /v1/* API + Cloudflare D1 SQLite Database)
# to Cloudflare on every push to `main` (or manual trigger).
#
# Required GitHub Secrets (Settings -> Secrets and variables -> Actions -> New repository secret):
#   CLOUDFLARE_API_TOKEN    (Cloudflare API Token with Workers Scripts:Edit, D1:Edit, Cloudflare Pages:Edit)
#   CLOUDFLARE_ACCOUNT_ID   (Your 32-character Cloudflare Account ID)
#
# Optional Secrets / Variables:
#   GEMINI_API_KEY                 (Optional: enables AI Mentor; falls back to rule-based mentor without it)
#   FCM_SERVICE_ACCOUNT_JSON       (Optional: enables real FCM push delivery; absent/invalid credentials keep push disabled)
#   CLOUDFLARE_D1_DATABASE_NAME    (Optional: defaults to `seylane-sabz-db`; must match the pre-existing D1 binding in wrangler.toml)
#   CLOUDFLARE_PAGES_PROJECT       (Optional: if you also want `wrangler pages deploy` in addition to Worker)
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy to Cloudflare + D1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Cloudflare credentials
        id: cf
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_SECRET: ${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
          PAGES_VAR: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          if [ -n "$PAGES_SECRET" ] || [ -n "$PAGES_VAR" ]; then
            echo "pages=true" >> "$GITHUB_OUTPUT"
          else
            echo "pages=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "### ☁️ راهنمای اتصال خودکار GitHub به Cloudflare"
              echo "برای اینکه گیت‌هاب به‌صورت خودکار دیتابیس D1 و سایت را روی کلودفلر منتشر کند، دو مقدار زیر را در **Settings → Secrets and variables → Actions** ثبت کنید:"
              echo "- \`CLOUDFLARE_API_TOKEN\`"
              echo "- \`CLOUDFLARE_ACCOUNT_ID\`"
              echo ""
              echo "یا مستقیماً از داخل داشبورد کلودفلر (**Workers & Pages → Create → Import a repository**) مخزن گیت‌هاب را وصل کنید."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.cf.outputs.configured == 'true'
        with:
          node-version: 22
          cache: npm

      - if: steps.cf.outputs.configured == 'true'
        run: npm ci

      - name: Build Functions + Seed Snapshot + Web PWA
        if: steps.cf.outputs.configured == 'true'
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_APP_ENV: prod
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ vars.VITE_FIREBASE_VAPID_KEY }}
        run: npm run build

      - name: Verify Existing Cloudflare D1 & Deploy Full-Stack Worker
        if: steps.cf.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DB_NAME: ${{ vars.CLOUDFLARE_D1_DATABASE_NAME || 'seylane-sabz-db' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
          # `wrangler deploy` reruns the configured build and overwrites apps/web/dist, so the
          # build-time values must also be present here or the deployed assets lose production config.
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_APP_ENV: prod
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ vars.VITE_FIREBASE_VAPID_KEY }}
        run: |
          set -euo pipefail
          echo "Checking pre-existing Cloudflare D1 database: $DB_NAME ..."
          DB_JSON=$(npx --yes wrangler@4 d1 list --json)
          DB_ID=$(node -e '
            const list = JSON.parse(process.argv[1] || "[]");
            if (!Array.isArray(list)) process.exit(2);
            const found = list.find(d => d.name === process.argv[2]);
            if (found && found.uuid) process.stdout.write(found.uuid);
          ' "$DB_JSON" "$DB_NAME")
          DB_BINDING_ID=$(awk '
            /^\[\[d1_databases\]\]/ { in_d1=1; next }
            /^\[/ { if (in_d1) exit }
            in_d1 && /^database_id[[:space:]]*=/ {
              value=$0; sub(/^[^\"]*\"/, "", value); sub(/\".*$/, "", value); print value; exit
            }
          ' wrangler.toml)

          if [ -z "$DB_ID" ] || [ -z "$DB_BINDING_ID" ]; then
            echo "::error::The configured D1 database was not found. Refusing to create or deploy against a different database."
            exit 1
          fi
          if [ "$DB_ID" != "$DB_BINDING_ID" ]; then
            echo "::error::D1 name lookup does not match the database_id in wrangler.toml. Refusing deployment."
            exit 1
          fi

          # These migrations are additive and idempotent. Do not create/replace a database here.
          echo "Applying additive, idempotent D1 schema migrations ..."
          npx --yes wrangler@4 d1 execute "$DB_NAME" --remote --file=migrations/0001_init.sql
          npx --yes wrangler@4 d1 execute "$DB_NAME" --remote --file=migrations/0002_d1_tx_scopes.sql

          # No auto-create and no ignored migration errors: a schema or binding mismatch is a hard stop.
          npx --yes wrangler@4 deploy

          if [ -n "$GEMINI_API_KEY" ]; then
            echo "Syncing GEMINI_API_KEY to the Worker ..."
            printf '%s' "$GEMINI_API_KEY" | npx --yes wrangler@4 secret put GEMINI_API_KEY
          fi

          if [ -n "$FCM_SERVICE_ACCOUNT_JSON" ]; then
            echo "Syncing FCM_SERVICE_ACCOUNT_JSON to the Worker ..."
            printf '%s' "$FCM_SERVICE_ACCOUNT_JSON" | npx --yes wrangler@4 secret put FCM_SERVICE_ACCOUNT_JSON
          fi

      - name: Optional Deploy to Cloudflare Pages (if CLOUDFLARE_PAGES_PROJECT is set)
        if: steps.cf.outputs.configured == 'true' && steps.cf.outputs.pages == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ secrets.CLOUDFLARE_PAGES_PROJECT || vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          npx --yes wrangler@4 pages deploy apps/web/dist --project-name "$PAGES_PROJECT" --branch main

name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Typecheck · Unit tests · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Composite index coverage (query shapes vs firestore.indexes.json)
        run: npm run check:indexes -w functions
      - run: npm run build

  emulator:
    name: Emulator (Rules + API on Firestore)
    runs-on: ubuntu-latest
    needs: quality
    env:
      GCLOUD_PROJECT: demo-seylane
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Rules + integration tests on the Firebase emulators
        run: npx -y firebase-tools@14 emulators:exec --project demo-seylane --only firestore,storage "npm run test:emulator -w functions"

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
        working-directory: apps/web
      - run: npm run test:e2e
        working-directory: apps/web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  lighthouse:
    name: Lighthouse (≥ 90, LCP < 3s)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build -w apps/web
      - name: Seeded local API (memory backend)
        working-directory: functions
        run: |
          LOCAL_PERSIST=false RESEED=true PORT=5001 nohup npx tsx src/local.ts > /tmp/api.log 2>&1 &
          npx -y wait-on@8 -t 120000 http://127.0.0.1:5001/v1/health
      - name: Lighthouse CI
        working-directory: apps/web
        run: npx -y -p @lhci/cli@0.15 -p puppeteer-core@24 lhci autorun --config=./lighthouserc.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: apps/web/.lighthouseci
          retention-days: 7

name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Typecheck · Unit tests · Cloudflare Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      # Build first: functions/src/cloudflare-worker.ts imports the generated
      # functions/lib/seed-snapshot.json, so typecheck fails on a clean checkout without it.
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - name: Composite index coverage (query shapes vs firestore.indexes.json)
        run: npm run check:indexes -w functions
      - name: Verify Cloudflare Worker + Assets bundle
        run: npx --yes wrangler@4 deploy --dry-run

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
        working-directory: apps/web
      - run: npm run test:e2e
        working-directory: apps/web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  lighthouse:
    name: Lighthouse (≥ 90, LCP < 3s)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w apps/web
      - name: Seeded local API (memory backend)
        working-directory: functions
        run: |
          LOCAL_PERSIST=false RESEED=true PORT=5001 nohup npx tsx src/local.ts > /tmp/api.log 2>&1 &
          API_PID=$!
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:5001/v1/health > /dev/null 2>&1; then
              echo "API is healthy after ${i}s"
              exit 0
            fi
            if ! kill -0 "$API_PID" 2> /dev/null; then
              echo "::error title=Local API exited early::$(tail -n 20 /tmp/api.log | tr '\n' ' ' | cut -c1-900)"
              exit 1
            fi
            sleep 1
          done
          echo "::error title=Local API did not become healthy in 90s::$(tail -n 20 /tmp/api.log | tr '\n' ' ' | cut -c1-900)"
          exit 1
      - name: Lighthouse CI
        working-directory: apps/web
        run: |
          export CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable)"
          echo "Chrome: $CHROME_PATH ($("$CHROME_PATH" --version))"
          npx -y -p @lhci/cli@0.15 -p puppeteer-core@24 lhci autorun --config=./lighthouserc.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: apps/web/.lighthouseci
          retention-days: 7

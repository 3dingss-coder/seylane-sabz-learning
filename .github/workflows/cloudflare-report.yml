name: Cloudflare report

# Read-only usage report (requests, errors, latency, D1, R2) from the Cloudflare GraphQL Analytics API.
# Needs repository secrets CF_API_TOKEN (read-only token) and CF_ACCOUNT_ID. Run it from the Actions tab
# ("Run workflow"), or it runs when this workflow or its script changes in a pull request.
on:
  workflow_dispatch:
    inputs:
      hours:
        description: 'How many hours back'
        default: '24'
  pull_request:
    paths: ['.github/workflows/cloudflare-report.yml', 'scripts/cf-report.mjs']

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Report
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          REPORT_HOURS: ${{ inputs.hours || '24' }}
        run: node scripts/cf-report.mjs

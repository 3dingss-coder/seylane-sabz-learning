# Netlify config — Seylane Sabz Learning (web PWA only)
# Put this file at the REPO ROOT (next to package.json).
#
# The backend (functions/, Firebase Cloud Functions + Firestore) is NOT hosted on Netlify.
# Deploy it separately (Firebase) and point the web app at it with the env var
# VITE_API_BASE (Netlify UI -> Site configuration -> Environment variables), e.g.
#   https://europe-west1-<project>.cloudfunctions.net/api
# Then add that site's URL to the API's ALLOWED_ORIGINS (CORS).

[build]
  base    = "/"
  # `prebuild` in apps/web runs sync-assets (copies logos/product images into public/).
  command = "npm run build -w apps/web"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "20"

# SPA routing + security headers already live in apps/web/public/_redirects and _headers
# (Netlify reads both formats natively). The rules below only add cache control for the PWA.

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

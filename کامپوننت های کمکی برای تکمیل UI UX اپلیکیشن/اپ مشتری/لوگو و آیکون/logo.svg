<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 180" width="100%" height="100%">
  <defs>
    <linearGradient id="seylanehGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
  </defs>

  <!-- Wing / Leaf Shape -->
  <g transform="translate(10, 20)">
    <!-- Base Wave Leaf -->
    <path d="M 10 95 C 45 45, 105 50, 125 70 C 135 60, 142 50, 150 45 C 160 38, 200 40, 235 48 C 175 75, 150 115, 140 135 C 115 110, 65 115, 10 95 Z" fill="url(#seylanehGrad)" />
    <!-- Droplet in Valley -->
    <path d="M 128 40 C 128 40, 116 65, 116 75 C 116 83, 121 88, 128 88 C 135 88, 140 83, 140 75 C 140 65, 128 40, 128 40 Z" fill="url(#dropGrad)" stroke="#10b981" stroke-width="2.5" />
    <!-- Water Drop shine -->
    <path d="M 123 68 C 121 72, 121 76, 123 79" fill="none" stroke="#059669" stroke-width="1.8" stroke-linecap="round" />
  </g>

  <!-- English Text Group -->
  <g fill="#10b981" font-family="'Vazirmatn', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <!-- SEYLANEH -->
    <text x="250" y="82" font-size="38" font-weight="900" letter-spacing="1">SEYLANEH</text>
    <!-- SABZ -->
    <text x="250" y="132" font-size="42" font-weight="900" letter-spacing="1">SABZ</text>
    <!-- PRODUCER & TRADE CO -->
    <text x="382" y="112" font-size="14" font-weight="800" letter-spacing="0.5">PRODUCER</text>
    <text x="382" y="132" font-size="14" font-weight="800" letter-spacing="0.5">&amp; TRADE CO</text>
  </g>
</svg>

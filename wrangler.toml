#:schema node_modules/wrangler/config-schema.json
name = "seylane-sabz-learning"
main = "functions/src/cloudflare-worker.ts"
compatibility_date = "2025-04-01"

[build]
command = "npm run build"

[assets]
directory = "apps/web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/v1/*"]

[vars]
# Production mode keeps phone auth fail-closed and applies production rate / playback protections.
APP_ENV = "prod"
PLAYBACK_BUDGET = "on"
RATE_LIMIT_SCALE = "1"
# Public site URL: used to build the absolute click-through link in web push notifications.
APP_URL = "https://academy-seylaneh.site"
# Storage migration is intentionally paused: the owner must verify the live D1/R2 inventory first.
# Even when manually triggered, D1 cleanup stays disabled until byte-for-byte verification is reviewed.
R2_MIGRATE_PURGE = "off"

# Scheduled jobs (deadline warnings, reminders, weekly digest, web-push flush).
# The Worker's `scheduled` handler (functions/src/cloudflare-worker.ts) dispatches on the cron
# expression, and the same handlers run on Cloudflare Functions via `onSchedule`.
# These expressions must match CRON_JOBS in functions/src/services/cron.ts. Times are UTC
# (Tehran has no DST).
[triggers]
crons = ["*/15 * * * *", "0 * * * *", "30 4 * * *", "30 6 * * *"]

# Cloudflare D1 Database binding (SQLite at the edge — 100% free tier)
# This pre-existing database ID is checked by the deploy workflow; do not replace it with a newly
# created database without explicit owner approval and a verified backup.
[[d1_databases]]
binding = "DB"
database_name = "seylane-sabz-db"
database_id = "f7a2ed30-00f4-42e6-b26f-343c24fe1853"

# Cloudflare R2 object storage for uploaded images, audio and video.
# Resumable parts and composed uploads may remain in D1; bulk D1 -> R2 migration is manual, byte-
# verified, and purge is disabled until the live inventory is explicitly reviewed.
[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "seylane-sabz-media"

# Workers Logs: capture invocations and errors (1101/1102/503) for diagnosis.
[observability]
enabled = true
head_sampling_rate = 1

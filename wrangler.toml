#:schema node_modules/wrangler/config-schema.json
name = "seylane-sabz-learning"
main = "functions/src/cloudflare-worker.ts"
compatibility_date = "2025-04-01"

[build]
command = "npm run build"

[assets]
directory = "apps/web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/v1/*"]

[vars]
APP_ENV = "dev"
PLAYBACK_BUDGET = "off"
RATE_LIMIT_SCALE = "20"

# Scheduled jobs (deadline warnings, reminders, weekly digest, web-push flush).
# The Worker's `scheduled` handler (functions/src/cloudflare-worker.ts) dispatches on the cron
# expression, and the same handlers run on Cloudflare Functions via `onSchedule`.
# These expressions must match CRON_JOBS in functions/src/services/cron.ts. Times are UTC
# (Tehran has no DST).
#
# NOTE: kept commented out on purpose, for two reasons that this environment could not settle:
# (1) Cloudflare enforces the cron-trigger plan limit at deploy time, and `wrangler deploy --dry-run` accepts the
#     block locally, so the plan cannot be checked from here; (2) a deploy that Cloudflare rejects leaves the live
#     site pinned to the previous version — strictly worse than a schedule that has not been enabled yet. So the
#     handlers stay wired and only the declaration is dormant. Owner action: confirm the plan supports Cron
#     Triggers, uncomment the two lines below, and check that the four schedules appear on the worker's Triggers
#     page. Until then, an external scheduler should call `POST /v1/admin/jobs/<name>` (see docs/USER-TODO.md §4).
# [triggers]
# crons = ["*/15 * * * *", "0 * * * *", "30 4 * * *", "30 6 * * *"]

# Cloudflare D1 Database binding (SQLite at the edge — 100% free tier)
# To connect your D1 database in Cloudflare Dashboard:
# Workers & Pages -> seylane-sabz-learning -> Settings -> Bindings -> Add -> D1 database -> Variable name: DB
# Or uncomment below when deploying via CLI with your database_id:
[[d1_databases]]
binding = "DB"
database_name = "seylane-sabz-db"
database_id = "f7a2ed30-00f4-42e6-b26f-343c24fe1853"

#:schema node_modules/wrangler/config-schema.json
name = "seylane-sabz-learning"
main = "functions/src/cloudflare-worker.ts"
compatibility_date = "2025-04-01"

[build]
command = "npm run build"

[assets]
directory = "apps/web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/v1/*"]

[vars]
APP_ENV = "dev"
PLAYBACK_BUDGET = "off"
RATE_LIMIT_SCALE = "20"
# Public site URL: used to build the absolute click-through link in web push notifications.
APP_URL = "https://academy-seylaneh.site"
# D1 -> R2 media move: files are copied to R2 and verified by size; the D1 copy is deleted only
# when this is "on" (flip it after checking that images/videos play from R2).
R2_MIGRATE_PURGE = "on"

# Scheduled jobs (deadline warnings, reminders, weekly digest, web-push flush).
# The Worker's `scheduled` handler (functions/src/cloudflare-worker.ts) dispatches on the cron
# expression, and the same handlers run on Cloudflare Functions via `onSchedule`.
# These expressions must match CRON_JOBS in functions/src/services/cron.ts. Times are UTC
# (Tehran has no DST).
[triggers]
crons = ["*/15 * * * *", "0 * * * *", "30 4 * * *", "30 6 * * *"]

# Cloudflare D1 Database binding (SQLite at the edge — 100% free tier)
# To connect your D1 database in Cloudflare Dashboard:
# Workers & Pages -> seylane-sabz-learning -> Settings -> Bindings -> Add -> D1 database -> Variable name: DB
# Or uncomment below when deploying via CLI with your database_id:
[[d1_databases]]
binding = "DB"
database_name = "seylane-sabz-db"
database_id = "f7a2ed30-00f4-42e6-b26f-343c24fe1853"

# Cloudflare R2 object storage for uploaded images, audio and video (replaces storing files in D1).
# Resumable-upload staging parts still use D1 and are moved to R2 automatically when complete.
[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "seylane-sabz-media"

# Workers Logs: capture invocations and errors (1101/1102/503) for diagnosis.
[observability]
enabled = true
head_sampling_rate = 1
